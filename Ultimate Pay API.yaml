components:
  schemas:
    Biller:
      type: object
      properties:
        biller_id:
          type: integer
      required:
      - biller_id
    BillersList:
      type: object
      properties:
        service_type:
          type: string
      required:
      - service_type
    CreateNewBill:
      type: object
      properties:
        service:
          type: integer
        due_amount:
          type: number
          format: double
        bill_no:
          type: string
        customer_no:
          type: integer
        branch_no:
          type: integer
        created_on_erp_at:
          type: string
        created_on_erp_by:
          type: integer
        uploaded_to_pay_by:
          type: integer
      required:
      - bill_no
      - branch_no
      - created_on_erp_at
      - created_on_erp_by
      - customer_no
      - due_amount
      - service
      - uploaded_to_pay_by
    CustomerConfirmation:
      type: object
      properties:
        to_customer_no:
          type: string
        biller:
          type: integer
        amount:
          type: number
          format: double
        currency:
          type: string
      required:
      - amount
      - biller
      - currency
      - to_customer_no
    GetPaymentFromDateToDate:
      type: object
      properties:
        from_date:
          type: string
        to_date:
          type: string
      required:
      - from_date
    GetPaymentWithFinCorpPaymentRefId:
      type: object
      properties:
        prepaid_reference_id:
          type: string
      required:
      - prepaid_reference_id
    GetPaymentWithPaginate:
      type: object
      properties:
        payment_id:
          type: integer
        page_no:
          type: integer
      required:
      - payment_id
    GetPaymentWithPrepaidReferenceId:
      type: object
      properties:
        prepaid_reference_id:
          type: string
      required:
      - prepaid_reference_id
    GetPaymentWithReferenceId:
      type: object
      properties:
        payment_reference_id:
          type: string
      required:
      - payment_reference_id
    Invoice:
      type: object
      properties:
        payment_id:
          type: integer
      required:
      - payment_id
    PaymentToAccount:
      type: object
      properties:
        biller_id:
          type: integer
        paid_amount:
          type: number
          format: double
        to_customer_no:
          type: string
        financial_corp_payment_id:
          type: string
        currency_code:
          type: string
        to_customer_name:
          type: string
        payer_name:
          type: string
        payer_type:
          type: integer
      required:
      - biller_id
      - currency_code
      - financial_corp_payment_id
      - paid_amount
      - payer_type
    PaymentWithRefId:
      type: object
      properties:
        paid_amount:
          type: number
          format: double
        prepaid_reference_id:
          type: string
        financial_corp_payment_id:
          type: string
        currency_code:
          type: string
        payer_name:
          type: string
        payer_type:
          type: integer
      required:
      - currency_code
      - financial_corp_payment_id
      - paid_amount
      - payer_type
      - prepaid_reference_id
    Paymentfee:
      type: object
      properties:
        biller_id:
          type: integer
        service_id:
          type: integer
        paid_amount:
          type: number
          format: double
        financial_corp_payment_id:
          type: string
        currency_code:
          type: string
        payer_name:
          type: string
        payer_type:
          type: integer
      required:
      - biller_id
      - currency_code
      - financial_corp_payment_id
      - paid_amount
      - payer_type
      - service_id
    RefundPayment:
      type: object
      properties:
        payment_reference_id:
          type: string
      required:
      - payment_reference_id
    SectoresSub:
      type: object
      properties:
        parent_sector_id:
          type: integer
      required:
      - parent_sector_id
