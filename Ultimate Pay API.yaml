openapi: 3.0.3
info:
  title: Ultimate Pay API
  version: 1.0.1
  description: Ultimate Pay Backend APIs fr test
paths:
  /api/v1/biller/get_payment_by_dates:
    post:
      operationId: biller_get_payment_by_dates_create
      parameters:
      - in: header
        name: X-Client-Id
        schema:
          type: string
        description: 'Client ID. Format: ''client_biller_<user_id>'' for biller or
          ''client_corp_<user_id>'' for financial corp'
        required: true
      - in: header
        name: X-Nonce
        schema:
          type: string
        description: Unique random string (single use) to prevent replay attacks
        required: true
      - in: header
        name: X-Signature
        schema:
          type: string
        description: |-
          RSA-SHA256 signature (base64). Canonical string = METHOD
          FULL_PATH
          TIMESTAMP
          NONCE
          BODY_SHA256
        required: true
      - in: header
        name: X-Timestamp
        schema:
          type: string
        description: 'Unix timestamp in seconds. Allowed clock drift: 300 seconds'
        required: true
      tags:
      - biller
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPaymentFromDateToDate'
            examples:
              ExampleForGetPaymentFromDateToDate_:
                value:
                  from_date: '2025-02-01'
                  to_date: '2027-02-01'
                  page_no: 1
                summary: 'Example for get payment from date to date '
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetPaymentFromDateToDate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetPaymentFromDateToDate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: Success response
